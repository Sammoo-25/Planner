services:
  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: ${DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${DB_NAME:-planer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: "5005"
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      DB_USER: ${DB_USER:?set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-planer}
      # Optional external agent service, run on the host; unreachable → 503 fallbacks
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://host.docker.internal:8000}
      AGENT_SERVICE_SECRET: ${AGENT_SERVICE_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5005:5005"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5005/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Not started by `docker compose up`. Run: docker compose --profile test run --rm backend-test
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      NODE_ENV: test
      # Obviously fake, test-only value (>=32 chars); never reuse as a real secret
      JWT_SECRET: test-only-fake-jwt-secret-0123456789abcdef
      DB_USER: ${DB_USER:?set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: planer_test
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./task-tracker
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5005/api}
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
